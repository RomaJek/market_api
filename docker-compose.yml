version: '3.8'

services:  # Servisler (Konteynerler) dizimi
  # 1-servis: Maǵlıwmatlar bazası (PostgreSQL)
  db:
    image: postgres:15-alpine  # Rásmiy, jeńil PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data/  # Maǵlıwmatlardı saqlaw (Persistency)
    env_file:
      - .env  # Barlıq o'zgeriwshilerdi usı fayldan júkle!
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  # 2-servis: Biziń Django joybarımız
  web:
    build: .  # Dockerfile-di usı papkadan izle hám qur
    # command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      # - .:/app  # Kodtı jańalaw (Hot-reload) ushınz
      - static_volume:/app/staticfiles # Django usı jerge fayllardı jıynaydı (collectstatic)
      - media_volume:/app/media
    expose:
      - 8000 # Porttı tek ishki tarmaq (Nginx) ushın ashamız
    depends_on:
      - db  # Baza iske túspesten, Django iske túspewi kerek
    env_file:
      - .env  # Barlıq o'zgeriwshilerdi usı fayldan júkle!
    # JAŃA SERVIS: Nginx
  nginx:
    image: nginx:1.25-alpine # Jeńil Nginx versiyası
    ports:
      - "80:80" # Sırtqı 80 porttı ishki 80 ge jalǵaw
      - "443:443"  # HTTPS portın ashamız!
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf # Sazlaw faylın ornatıw
      - static_volume:/home/app/web/staticfiles # Django jıynaǵan fayllardı oqıw
      - media_volume:/home/app/web/media
      # SSL sertifikatlar ushın ortalıq papkalar:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - web # Django iske túskennen keyin Nginx iske tússin
  # JAŃA SERVIS: Certbot
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  postgres_data:  # Baza maǵlıwmatları saqlanatuǵın orın
  static_volume:  # Dizimnen o'tkeremiz
  media_volume:
  # Jańa volumelar:
  certbot_conf: # Haqıyqıy sertifikatlar ushın
  certbot_www:  # Tekseriw (Challenge) faylları ushın

